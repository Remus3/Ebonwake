[pytest]
testpaths = tests
addopts = -q --durations=25 --strict-markers
markers =
    slow: call takes over about 1.5 s on the dev box (plan 097; --fast skips it)
    server: binds a socket, e.g. an HTTP server on 127.0.0.1:0 (plan 097)
    git: spawns a real git process (plan 097; --fast skips it)
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
