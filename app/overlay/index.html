<!doctype html>
<html lang="en" data-theme="dark" class="ew-overlay">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:8940; style-src 'self'; script-src 'self'">
<title>Ebonwake overlay</title>
<link rel="stylesheet" href="../../ops/fleet_kit/tokens.css">
<link rel="stylesheet" href="../shared/ew.css">
</head>
<body>
<div class="ew-ov">
  <div class="ew-ov-row ew-ov-head" id="ov-game-row"><span class="ew-muted">Game</span><span><span id="ov-game-dot" class="ew-dot unknown"></span><span id="ov-game">-</span></span></div>
  <div class="ew-ov-row"><span class="ew-muted">Daily reset</span><span id="ov-daily">-</span></div>
  <div class="ew-ov-row"><span class="ew-muted">Weekly reset</span><span id="ov-weekly">-</span></div>
  <div class="ew-ov-row"><span class="ew-muted">Today</span><span id="ov-today">-</span></div>
  <div class="ew-ov-row" id="ov-grind-row" hidden><span class="ew-muted">Grind</span><span id="ov-grind">-</span></div>
  <div class="ew-ov-row" id="ov-buff-row" hidden><span class="ew-muted" id="ov-buff-name">Buff</span><span id="ov-buff">-</span></div>
  <div class="ew-ov-row" id="ov-events-row" hidden><span class="ew-muted ew-mname" id="ov-events-name">Event</span><span id="ov-events">-</span></div>
  <div class="ew-ov-row" id="ov-leveling-row" hidden><span class="ew-mname" id="ov-leveling">-</span></div>
  <div class="ew-ov-row"><span class="ew-muted">Server</span><span id="ov-server">?</span></div>
</div>
<script src="../shared/ewcore.js"></script>
<script src="overlay.js"></script>
</body>
</html>
