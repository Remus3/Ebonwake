<!doctype html>
<html lang="en" data-theme="dark" class="ew-overlay">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:8940; style-src 'self'; script-src 'self'">
<title>Ebonwake overlay</title>
<link rel="stylesheet" href="../../ops/fleet_kit/tokens.css">
<link rel="stylesheet" href="../shared/ew.css">
</head>
<body>
<div class="ew-ov" id="ov-panel">
  <div class="ew-ov-row ew-ov-head" id="ov-game-row"><span class="ew-ov-lab"><span id="ov-server-dot" class="ew-dot bad" title="EW server offline" hidden></span>Game</span><span class="ew-ov-val"><span id="ov-game-dot" class="ew-dot unknown"></span><span id="ov-game">-</span></span></div>
  <div class="ew-ov-row" id="ov-whatnow-row" hidden><span class="ew-ov-lab">Now</span><span class="ew-ov-val ew-mname" id="ov-whatnow">-</span></div>
  <div class="ew-ov-row"><span class="ew-ov-lab">Daily reset</span><span class="ew-ov-val" id="ov-daily">-</span></div>
  <div class="ew-ov-row"><span class="ew-ov-lab">Weekly reset</span><span class="ew-ov-val" id="ov-weekly">-</span></div>
  <div class="ew-ov-row" id="ov-today-row"><span class="ew-ov-lab">Today</span><span class="ew-ov-val" id="ov-today">-</span></div>
  <div id="ov-widgets">
    <div class="ew-ov-row" id="ov-dice-row" hidden><span class="ew-ov-lab">Dice</span><span class="ew-ov-val" id="ov-dice">-</span></div>
    <div class="ew-ov-row" id="ov-grind-row" hidden><span class="ew-ov-lab">Grind</span><span class="ew-ov-val ew-mname" id="ov-grind">-</span></div>
    <div class="ew-ov-row" id="ov-buff-row" hidden><span class="ew-ov-lab ew-mname" id="ov-buff-name">Buff</span><span class="ew-ov-val" id="ov-buff">-</span></div>
    <div class="ew-ov-row" id="ov-events-row" hidden><span class="ew-ov-lab ew-mname" id="ov-events-name">Event</span><span class="ew-ov-val" id="ov-events">-</span></div>
    <div class="ew-ov-row" id="ov-leveling-row" hidden><span class="ew-ov-lab">Leveling</span><span class="ew-ov-val ew-mname" id="ov-leveling">-</span><span class="ew-pill bad" id="ov-deadline" hidden></span></div>
    <div class="ew-ov-row" id="ov-season-row" hidden><span class="ew-ov-lab">Season</span><span class="ew-ov-val ew-mname" id="ov-season">-</span></div>
    <div class="ew-ov-row" id="ov-boss-row" hidden><span class="ew-ov-lab ew-mname" id="ov-boss-name">World boss</span><span class="ew-ov-val" id="ov-boss">-</span></div>
    <div class="ew-ov-row ew-ov-boss-next" id="ov-boss-next-row" hidden><span class="ew-ov-lab ew-mname" id="ov-boss-next-name">then</span><span class="ew-ov-val" id="ov-boss-next">-</span></div>
    <div class="ew-ov-tick" id="ov-ticker-row" hidden><div class="ew-ov-row ew-ov-tick-head"><span class="ew-ov-lab">Market</span><span class="ew-ov-val" id="ov-ticker-state"></span></div><div id="ov-ticker"></div></div>
    <div class="ew-ov-row" id="ov-maint-row" hidden><span class="ew-ov-lab">Maintenance</span><span class="ew-ov-val" id="ov-maint">-</span></div>
  </div>
  <div class="ew-ov-row" id="ov-server-row" hidden><span class="ew-ov-lab">Server</span><span class="ew-ov-val" id="ov-server">?</span></div>
</div>
<script src="../shared/ewcore.js"></script>
<script src="overlay.js"></script>
</body>
</html>
