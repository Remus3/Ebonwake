<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:8940; img-src 'self' http://127.0.0.1:8940; style-src 'self'; script-src 'self'">
<title>Ebonwake</title>
<link rel="stylesheet" href="../../ops/fleet_kit/tokens.css">
<link rel="stylesheet" href="../shared/ew.css">
</head>
<body>
<div class="ew-shell">
  <header class="ew-top">
    <button class="ew-chip" id="class-chip" type="button"><span class="ew-chip-img ew-chip-empty" role="img" aria-label="Character: no portrait yet"></span><span class="ew-chip-name">EBONWAKE</span></button>
    <nav class="ew-tabs" id="tabs" role="tablist"></nav>
    <button class="ew-btn ew-palbtn" id="palette-open" type="button" aria-label="Command palette">Ctrl+K</button>
    <span class="ew-pill unknown" id="server-pill">server ?</span>
    <button class="ew-btn" id="server-restart" type="button" hidden>Restart server</button>
  </header>
  <div class="ew-main">
    <aside class="ew-rail" aria-label="Character">
      <button class="ew-card-btn" id="char-card" type="button" aria-label="Character card"><span class="ew-card-frame"><span class="ew-card-pic ew-card-empty" role="img" aria-label="Character: no portrait yet"></span></span><span class="ew-card-lines"></span></button>
    </aside>
    <main id="panels" class="ew-panels"></main>
  </div>
</div>
<div class="ew-toasts" id="toasts" role="status" aria-live="polite"></div>
