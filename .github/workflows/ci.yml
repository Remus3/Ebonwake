name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: action pins match their tag comments
        run: python tools/verify_action_pins.py
      - name: install CI deps (hash-pinned)
        run: python -m pip install --quiet --require-hashes -r ci/requirements-ci.txt
      - name: ruff (lint gate)
        run: python -m ruff check server tools tests
      - name: pytest
        run: python -m pytest -q
      - name: node tests (no Electron needed)
        run: npm test --prefix app
      - name: leak sweep (structural arm; no needle config on CI)
        run: python tools/leak_sweep.py --tree
