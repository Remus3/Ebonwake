name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: action pins match their tag comments
        run: python tools/verify_action_pins.py
      - name: install CI deps (hash-pinned)
        run: python -m pip install --quiet --require-hashes -r ci/requirements-ci.txt
      - name: ruff (lint gate)
        run: python -m ruff check server tools tests
      - name: pytest
        run: python -m pytest -q
      - name: node tests (no Electron needed)
        run: npm test --prefix app
      - name: leak sweep (structural arm; no needle config on CI)
        run: python tools/leak_sweep.py --tree
